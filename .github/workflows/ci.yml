name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Lint
        run: lute run lint

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Run tests
        run: lute test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Build
        run: lute run build

      - name: Verify dist ships no Lute requires or test files
        run: |
          if grep -rn 'require("@lute\|require("@std' dist; then
            echo "::error::Lute-only requires leaked into dist"
            exit 1
          fi
          if find dist -name '*.test.luau' | grep -q .; then
            echo "::error::test files leaked into dist"
            exit 1
          fi
          if [ -d dist/testing ]; then
            echo "::error::test helpers leaked into dist"
            exit 1
          fi

      - name: Get model file name
        run: |
          sha=${GITHUB_SHA:0:7}
          echo "MODEL_FILE=Archivist-$sha.rbxm" >> $GITHUB_ENV

      - name: Rename model
        run: mv Archivist.rbxm ${{ env.MODEL_FILE }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MODEL_FILE }}
          path: ${{ env.MODEL_FILE }}

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Setup Lute typedefs
        run: lute setup

      - name: Install packages (Lute batteries, referenced by std typedefs)
        run: lute pkg install

      - name: Build (analysis covers the built Roblox flavor)
        run: lute run build

      - name: Run Luau analysis
        run: lute run analyze
